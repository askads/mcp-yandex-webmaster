[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-yandex-webmaster"
version = "0.0.1"
description = "MCP-сервер для Yandex Webmaster — индексация, поисковые запросы, sitemap, диагностика сайта и внешние ссылки. Для Claude, Cursor, Codex и других AI-клиентов."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "gistrec", email = "gistrec@gmail.com" }]
keywords = ["mcp", "yandex", "webmaster", "seo"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/askads/mcp-yandex-webmaster"
Repository = "https://github.com/askads/mcp-yandex-webmaster"

[tool.hatch.build.targets.wheel]
packages = ["mcp_yandex_webmaster"]
