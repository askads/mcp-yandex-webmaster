name: Health check

# End-to-end read-only check against the live Yandex Webmaster API v4
# (api.webmaster.yandex.net). Auth is a long-lived Yandex OAuth token stored as a repo
# secret — no per-run minting. smoke makes NO writes (resolves the user id and lists the
# user's sites). Runs daily + manual dispatch only (never on push/PR), so secrets aren't
# exposed to PRs/forks.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'askads/mcp-yandex-webmaster'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Read-only smoke check
        run: npm run smoke
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
